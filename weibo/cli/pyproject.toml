[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weibo-cli"
version = "0.1.0"
description = "Modular Weibo search and evidence screenshot CLI"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31",
  "Pillow>=10.0",
  "websockets>=11.0",
  "Scrapy>=2.11",
]

[project.scripts]
weibo-cli = "weibo_cli.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["weibo_cli*"]
